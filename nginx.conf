server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Attenzione: un add_header dentro una location annulla tutti quelli del server.
    # Per questo le intestazioni di sicurezza sono ripetute in ogni location che ne aggiunge altre.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # sempre l'ultima versione dell'app e del service worker
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }
    location = /engine.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }

    location ~ \.webmanifest$ {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
